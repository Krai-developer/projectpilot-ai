services:
  ollama:
    image: ollama/ollama:latest
    container_name: projectpilot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectpilot-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/data/projectpilot.db
      - SECRET_KEY=${SECRET_KEY:-replace-with-a-secure-64-char-random-hex-key-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_TIMEOUT_SECONDS=60
    volumes:
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: projectpilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  ollama_data:
  sqlite_data:
